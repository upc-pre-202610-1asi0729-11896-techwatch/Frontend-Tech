<div class="app-layout">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <img src="/imagotipo.jpeg" alt="TechWatch" class="brand-icon">
    </div>

    <div class="sidebar-nav">
      <a class="nav-link" routerLink="/management/properties" routerLinkActive="active">
        <mat-icon class="nav-icon">home_work</mat-icon>
        <span>Properties</span>
      </a>
      <a class="nav-link" routerLink="/simulation" routerLinkActive="active">
        <mat-icon class="nav-icon">play_circle</mat-icon>
        <span>Simulation</span>
      </a>
      <a class="nav-link" routerLink="/analytics/dashboard" routerLinkActive="active">
        <mat-icon class="nav-icon">bar_chart</mat-icon>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" routerLink="/analytics/alerts" routerLinkActive="active">
        <mat-icon class="nav-icon">notifications</mat-icon>
        <span>Alerts</span>
      </a>
      <a class="nav-link" routerLink="/analytics/reports" routerLinkActive="active">
        <mat-icon class="nav-icon">description</mat-icon>
        <span>Reports</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <button class="user-menu-trigger" [matMenuTriggerFor]="userMenu">
        <mat-icon class="user-icon">account_circle</mat-icon>
        <span class="user-email">{{ authStore.email() }}</span>
        <mat-icon class="user-caret">expand_more</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </div>
  </nav>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
